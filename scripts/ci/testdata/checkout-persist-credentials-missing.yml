# expect: every actions/checkout needs persist-credentials: false
# Bad-workflow fixture for scripts/ci/test-check-workflows.sh (one fault).
# Never move this under .github/workflows/.
name: fixture
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Step
        run: make check
