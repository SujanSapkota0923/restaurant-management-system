# expect: unpinned or uncommented action
# Bad-workflow fixture for scripts/ci/test-check-workflows.sh (one fault).
# Never move this under .github/workflows/.
name: fixture
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Step
        run: make check
